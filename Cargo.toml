[package]
name = "tattletale"
version = "0.1.1"
edition = "2021"
rust-version = "1.83"
description = "See every domain your apps phone home to"
license = "MIT"
repository = "https://github.com/0DukePan/tattletale"
readme = "README.md"
keywords = ["privacy", "network", "dns", "windows", "cli"]
categories = ["command-line-utilities"]
default-run = "tattle"

[lib]
name = "tattletale"
path = "src/lib.rs"

[[bin]]
name = "tattle"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
ureq = "2"
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Time",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

