[advisories]
# Fail on vulnerabilities in dependencies. A privacy tool that ships a known
# vulnerable TLS stack is not a privacy tool.
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# The project is MIT. Everything linked into the binary must be compatible.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
